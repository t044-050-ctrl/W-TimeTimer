<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイムタイマー</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans JP', 'Inter', -apple-system, sans-serif;
            font-variant-numeric: normal; /* 斜線ゼロを回避 */
            background-color: #f8fafc;
            color: #0f172a;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .square-box {
            aspect-ratio: 1 / 1;
        }

        /* スクロールバーを非表示にするスタイル */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden bg-neutral-100 text-neutral-800 relative pb-24">

    <main class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-8 flex items-center justify-center">
        <div id="main-grid" class="w-full grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 items-center justify-items-center">

            <!-- LEFT: VISUAL TIME TIMER (CANVAS) -->
            <div id="container-timer" class="w-full max-w-lg flex flex-col items-center justify-center transition-all duration-300 relative">
                <div class="w-full square-box relative flex items-center justify-center p-2">
                    <canvas id="timer-canvas" class="w-full h-full drop-shadow-md cursor-pointer touch-none"></canvas>
                </div>

                <!-- Timer-Only Actions (Positioned directly BELOW timer circle) -->
                <div id="timer-only-actions" class="w-full max-w-md mt-4 grid grid-cols-3 gap-2 sm:gap-3 hidden z-20">
                    <button id="btn-toggle-timer-only" class="py-3 px-2 sm:px-3 bg-neutral-700 hover:bg-neutral-800 active:scale-95 text-white rounded-2xl font-bold text-sm sm:text-base md:text-lg shadow-md transition-all flex items-center justify-center gap-1">
                        <svg id="play-icon-only" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="pause-icon-only" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                        <span id="toggle-button-text-only">スタート</span>
                    </button>

                    <button id="btn-restart-only" class="py-3 px-2 sm:px-3 bg-white hover:bg-neutral-100 active:scale-95 text-neutral-800 rounded-2xl font-bold text-sm sm:text-base md:text-lg border border-neutral-300 shadow-sm transition-all flex items-center justify-center gap-1">
                        <svg class="w-4 h-4 sm:w-5 sm:h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span>もう一度</span>
                    </button>

                    <button id="btn-reset-only" class="py-3 px-2 sm:px-3 bg-neutral-200 hover:bg-neutral-300 active:scale-95 text-neutral-800 font-bold rounded-2xl border border-neutral-300 text-sm sm:text-base md:text-lg transition-colors flex items-center justify-center">
                        リセット
                    </button>
                </div>
            </div>

            <!-- RIGHT: DIGITAL TIMER & CONTROLS -->
            <div id="container-digital" class="w-full max-w-xl flex flex-col items-center gap-5 bg-white p-4 md:p-8 rounded-3xl border border-neutral-200 shadow-sm transition-all duration-300">
                
                <!-- Digital Time Display Row (Fills frame with ultra-large visible numbers) -->
                <div class="w-full flex items-center justify-between gap-2 md:gap-4">
                    <div class="bg-white text-neutral-900 border-2 border-neutral-200 font-bold rounded-2xl px-1 py-3 md:px-4 md:py-6 flex-1 flex flex-col justify-center items-center shadow-sm overflow-hidden min-w-0 relative min-h-[130px] md:min-h-[170px]">
                        <!-- Top-Left Period Badge (午前/午後) in 12h Clock Mode -->
                        <div id="period-badge" class="absolute top-2 left-3 text-xs md:text-sm font-bold text-neutral-500 hidden">午前</div>
                        <div id="digital-display" class="w-full h-full flex items-baseline justify-center text-6xl sm:text-8xl md:text-9xl lg:text-[8.5rem] font-black tracking-tighter whitespace-nowrap select-none leading-none">00:00</div>
                    </div>

                    <!-- Up / Down Adjust Buttons -->
                    <div id="timer-adjust-controls" class="flex flex-col gap-2 shrink-0">
                        <button id="btn-time-up" class="w-12 h-12 md:w-14 md:h-14 bg-neutral-100 hover:bg-neutral-200 active:bg-neutral-300 text-neutral-700 rounded-xl font-bold flex items-center justify-center border border-neutral-300 transition-colors text-xl md:text-2xl" title="1分増やす">
                            ▲
                        </button>
                        <button id="btn-time-down" class="w-12 h-12 md:w-14 md:h-14 bg-neutral-100 hover:bg-neutral-200 active:bg-neutral-300 text-neutral-700 rounded-xl font-bold flex items-center justify-center border border-neutral-300 transition-colors text-xl md:text-2xl" title="1分減らす">
                            ▼
                        </button>
                    </div>
                </div>

                <!-- Clock 12h / 24h Toggle Buttons (Discreet) -->
                <div id="clock-format-toggle" class="flex gap-2 justify-center hidden my-0.5">
                    <button id="btn-clock-12h" class="text-[11px] font-medium text-neutral-500 hover:text-neutral-800 px-2 py-1 rounded-md border border-neutral-200 bg-neutral-100 transition-colors">12時間表示</button>
                    <button id="btn-clock-24h" class="text-[11px] font-medium text-neutral-400 hover:text-neutral-800 px-2 py-1 rounded-md border border-neutral-200 transition-colors">24時間表示</button>
                </div>

                <!-- Main Action Buttons Row (Start/Pause & Restart) -->
                <div id="timer-main-actions" class="w-full grid grid-cols-2 gap-3 md:gap-4">
                    <button id="btn-toggle-timer" class="py-4 md:py-5 bg-neutral-700 hover:bg-neutral-800 active:scale-[0.98] text-white rounded-2xl font-bold text-xl md:text-2xl shadow-md transition-all flex items-center justify-center gap-2">
                        <svg id="play-icon" class="w-6 h-6 md:w-7 md:h-7 fill-current" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="pause-icon" class="w-6 h-6 md:w-7 md:h-7 fill-current hidden" viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                        <span id="toggle-button-text">スタート</span>
                    </button>

                    <button id="btn-restart" class="py-4 md:py-5 bg-neutral-100 hover:bg-neutral-200 active:bg-neutral-300 active:scale-[0.98] text-neutral-800 rounded-2xl font-bold text-xl md:text-2xl border border-neutral-300 shadow-sm transition-all flex items-center justify-center gap-2" title="スタート前の設定時間に戻します">
                        <svg class="w-6 h-6 md:w-7 md:h-7 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span>もう一度</span>
                    </button>
                </div>

                <!-- Quick Add & Reset Buttons -->
                <div id="timer-quick-actions" class="w-full grid grid-cols-5 gap-1.5 sm:gap-2 md:gap-3">
                    <button id="btn-add-10" class="py-3 bg-neutral-100 hover:bg-neutral-200 active:bg-neutral-300 text-neutral-700 font-bold rounded-xl border border-neutral-200 text-xs sm:text-sm md:text-base transition-colors">
                        +10分
                    </button>
                    <button id="btn-add-5" class="py-3 bg-neutral-100 hover:bg-neutral-200 active:bg-neutral-300 text-neutral-700 font-bold rounded-xl border border-neutral-200 text-xs sm:text-sm md:text-base transition-colors">
                        +5分
                    </button>
                    <button id="btn-add-1" class="py-3 bg-neutral-100 hover:bg-neutral-200 active:bg-neutral-300 text-neutral-700 font-bold rounded-xl border border-neutral-200 text-xs sm:text-sm md:text-base transition-colors">
                        +1分
                    </button>
                    <button id="btn-add-10s" class="py-3 bg-neutral-100 hover:bg-neutral-200 active:bg-neutral-300 text-neutral-700 font-bold rounded-xl border border-neutral-200 text-xs sm:text-sm md:text-base transition-colors">
                        +10秒
                    </button>
                    <button id="btn-reset" class="py-3 bg-neutral-200 hover:bg-neutral-300 active:bg-neutral-400 text-neutral-800 font-bold rounded-xl border border-neutral-300 text-xs sm:text-sm md:text-base transition-colors" title="0:00に戻します">
                        リセット
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- BOTTOM CONTROL TOOLBAR (SETTINGS & VIEW MODES) -->
    <div class="fixed bottom-3 left-1/2 -translate-x-1/2 bg-white/95 backdrop-blur-md border border-neutral-300 shadow-xl rounded-2xl p-1 flex items-center gap-0.5 sm:gap-1 z-30 max-w-[98vw] overflow-x-auto no-scrollbar">
        
        <!-- View Mode Switch Buttons -->
        <button id="mode-timer-only" class="mode-btn px-2 sm:px-3 py-1.5 rounded-xl text-[11px] sm:text-xs md:text-sm font-bold transition-all shrink-0 text-neutral-600 hover:bg-neutral-100">
            タイムタイマー
        </button>
        <button id="mode-both" class="mode-btn px-2 sm:px-3 py-1.5 rounded-xl text-[11px] sm:text-xs md:text-sm font-bold transition-all shrink-0 bg-neutral-900 text-white shadow-sm">
            タイム＋デジタル
        </button>
        <button id="mode-digital-only" class="mode-btn px-2 sm:px-3 py-1.5 rounded-xl text-[11px] sm:text-xs md:text-sm font-bold transition-all shrink-0 text-neutral-600 hover:bg-neutral-100">
            デジタルタイマー
        </button>
        <button id="mode-clock" class="mode-btn px-2 sm:px-3 py-1.5 rounded-xl text-[11px] sm:text-xs md:text-sm font-bold transition-all shrink-0 text-neutral-600 hover:bg-neutral-100 flex items-center gap-1">
            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            現在時刻
        </button>

        <div class="h-4 w-[1px] bg-neutral-300 mx-0.5 shrink-0"></div>

        <!-- Color Settings Button (Far Right) -->
        <button id="btn-open-settings" class="px-2 sm:px-3 py-1.5 text-neutral-700 hover:bg-neutral-100 rounded-xl transition-all flex items-center gap-1 text-[11px] sm:text-xs md:text-sm font-semibold shrink-0">
            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-neutral-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            設定
        </button>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-neutral-200 flex flex-col gap-6">
            
            <div class="flex justify-between items-center border-b border-neutral-200 pb-3">
                <h2 class="text-xl font-bold text-neutral-800">設定</h2>
                <button id="btn-close-settings" class="text-neutral-400 hover:text-neutral-600 text-2xl font-bold leading-none">&times;</button>
            </div>

            <!-- Finish Message Setting -->
            <div>
                <label for="input-finish-msg" class="block text-sm font-bold text-neutral-700 mb-2">終了時の文字</label>
                <input type="text" id="input-finish-msg" class="w-full px-4 py-2.5 rounded-xl border border-neutral-300 focus:outline-none focus:ring-2 focus:ring-neutral-800 text-neutral-800 font-bold text-base" placeholder="おわり" maxlength="20">
            </div>

            <!-- Finish Text Color Palette Selection -->
            <div>
                <label class="block text-sm font-bold text-neutral-700 mb-3">終了時の文字の色</label>
                <div class="flex items-center justify-between gap-2 px-2">
                    <button class="text-color-btn w-12 h-12 rounded-full border-2 border-transparent transition-all shadow-sm bg-red-500" data-text-color="#ef4444" title="赤"></button>
                    <button class="text-color-btn w-12 h-12 rounded-full border-2 border-transparent transition-all shadow-sm bg-sky-400" data-text-color="#38bdf8" title="水色"></button>
                    <button class="text-color-btn w-12 h-12 rounded-full border-2 border-transparent transition-all shadow-sm bg-yellow-400" data-text-color="#eab308" title="黄色"></button>
                    <button class="text-color-btn w-12 h-12 rounded-full border-2 border-transparent transition-all shadow-sm bg-lime-500" data-text-color="#84cc16" title="黄緑"></button>
                    <button class="text-color-btn w-12 h-12 rounded-full border-2 border-transparent transition-all shadow-sm bg-orange-500" data-text-color="#f97316" title="オレンジ"></button>
                </div>
            </div>

            <!-- Color Palette Selection -->
            <div>
                <label class="block text-sm font-bold text-neutral-700 mb-3">タイマーの色</label>
                <div class="flex items-center justify-between gap-2 px-2">
                    <button class="color-btn w-12 h-12 rounded-full border-2 border-transparent transition-all shadow-sm bg-red-500" data-color="#ef4444" title="赤"></button>
                    <button class="color-btn w-12 h-12 rounded-full border-2 border-transparent transition-all shadow-sm bg-sky-400" data-color="#38bdf8" title="水色"></button>
                    <button class="color-btn w-12 h-12 rounded-full border-2 border-transparent transition-all shadow-sm bg-yellow-400" data-color="#eab308" title="黄色"></button>
                    <button class="color-btn w-12 h-12 rounded-full border-2 border-transparent transition-all shadow-sm bg-lime-500" data-color="#84cc16" title="黄緑"></button>
                    <button class="color-btn w-12 h-12 rounded-full border-2 border-transparent transition-all shadow-sm bg-orange-500" data-color="#f97316" title="オレンジ"></button>
                </div>
            </div>

            <!-- Save / Done Button -->
            <button id="btn-save-settings" class="w-full py-3 bg-neutral-900 text-white font-bold rounded-2xl hover:bg-black transition-colors">
                完了
            </button>
        </div>
    </div>

    <!-- APPLICATION JAVASCRIPT LOGIC -->
    <script>
        // APP STATE
        let state = {
            setMinutes: 0,          // Selected total timer minutes (0 - 60)
            remainingSeconds: 0,    // Current active remaining seconds
            initialSeconds: 0,      // Starting seconds for "もう一度" restart
            timerColor: '#ef4444',    // Default timer disk color
            finishMessage: 'おわり',   // Message displayed when finished
            finishTextColor: '#ef4444', // Default text color when finished
            status: 'stopped',       // 'stopped' | 'running' | 'paused' | 'finished'
            viewMode: 'both',       // 'both' | 'timer-only' | 'digital-only' | 'clock'
            clockFormat: '12h'      // '12h' | '24h'
        };

        let timerInterval = null;
        let clockInterval = null;
        let audioCtx = null;
        let alarmInterval = null;
        let isDraggingCanvas = false;

        // HELPER FOR SAFE EVENT LISTENING
        function addEvt(id, eventName, handler) {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener(eventName, handler);
            }
        }

        // LOCAL STORAGE LOAD/SAVE
        function loadSavedState() {
            try {
                const savedColor = localStorage.getItem('time_timer_color');
                if (savedColor) state.timerColor = savedColor;
                
                const savedMsg = localStorage.getItem('time_timer_finish_msg');
                if (savedMsg !== null && savedMsg !== '') {
                    state.finishMessage = savedMsg;
                }

                const savedTextColor = localStorage.getItem('time_timer_finish_text_color');
                if (savedTextColor) {
                    state.finishTextColor = savedTextColor;
                }
            } catch (e) {
                console.error('LocalStorage error:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem('time_timer_color', state.timerColor);
                localStorage.setItem('time_timer_finish_msg', state.finishMessage);
                localStorage.setItem('time_timer_finish_text_color', state.finishTextColor);
            } catch (e) {
                console.error('LocalStorage save error:', e);
            }
        }

        // Dynamic scale minutes based on set duration
        function getScaleMinutes(minutes) {
            if (minutes <= 0) return 60;
            if (minutes <= 5) return 5;
            if (minutes <= 10) return 10;
            if (minutes <= 30) return 30;
            return 60;
        }

        // CANVAS TIMER & CLOCK DRAWING
        const canvas = document.getElementById('timer-canvas');
        const ctx = canvas ? canvas.getContext('2d') : null;

        function resizeCanvas() {
            if (!canvas || !ctx) return;
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            if (rect.width === 0 || rect.height === 0) return;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            
            drawTimer();
        }

        // DRAW TIMER (MIRRORED / COUNTER-CLOCKWISE DIAL & WEDGE)
        function drawTimer() {
            if (!canvas || !ctx) return;
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const centerX = width / 2;
            const centerY = height / 2;

            ctx.clearRect(0, 0, width, height);

            // Clock mode rendering
            if (state.viewMode === 'clock') {
                drawAnalogClock(centerX, centerY);
                return;
            }

            const maxRadius = Math.min(centerX, centerY) - 4;
            const labelRadius = maxRadius - 10; // Numbers outside
            const dialRadius = maxRadius - 28;  // Dial circle

            // Force 60-minute scale while dragging for easy and consistent swipe control
            const scaleMinutes = isDraggingCanvas ? 60 : getScaleMinutes(state.setMinutes);
            const scaleSeconds = scaleMinutes * 60;

            // 1. Clock Face Inner Circle Background
            ctx.beginPath();
            ctx.arc(centerX, centerY, dialRadius, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = '#cbd5e1';
            ctx.stroke();

            // 2. Counter-Clockwise Color Wedge Pie (Starts 12 o'clock, extends Counter-Clockwise)
            if (state.remainingSeconds > 0) {
                const remainingFraction = Math.min(1, state.remainingSeconds / scaleSeconds);
                // Top position is -Math.PI / 2. Extending COUNTER-CLOCKWISE means subtracting angle.
                const endAngle = -Math.PI / 2 - (2 * Math.PI * remainingFraction);

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, dialRadius - 1, -Math.PI / 2, endAngle, true); // true = anticlockwise
                ctx.closePath();
                ctx.fillStyle = state.timerColor;
                ctx.fill();
            }

            // 3. Counter-Clockwise Ticks & Scale Numbers (Skipping 0)
            ctx.save();
            ctx.translate(centerX, centerY);

            const tickCount = scaleMinutes <= 10 ? scaleMinutes * 5 : 60;
            for (let i = 0; i < tickCount; i++) {
                // Counter-Clockwise angle calculation
                const angle = -(i * 2 * Math.PI) / tickCount;
                const isMajor = (i % 5 === 0);

                const tickLength = isMajor ? 8 : 4;
                const tickWidth = isMajor ? 2 : 1;

                ctx.beginPath();
                ctx.rotate(angle);
                ctx.moveTo(0, -dialRadius);
                ctx.lineTo(0, -dialRadius + tickLength);
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = tickWidth;
                ctx.stroke();
                ctx.rotate(-angle);
            }

            // Dial Numbers (Counter-Clockwise: 5 at 11 o'clock, 15 at 9 o'clock, etc.)
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 15px "Inter", "Noto Sans JP", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            let step = 5;
            if (scaleMinutes === 5) step = 1;
            else if (scaleMinutes === 10) step = 2;
            else if (scaleMinutes === 30) step = 5;
            else step = 5;

            for (let m = 0; m <= scaleMinutes; m += step) {
                if (m === 0) continue; // SKIP 0 NUMBER

                // Counter-clockwise angle from top (-Math.PI/2)
                const angle = -Math.PI / 2 - (m / scaleMinutes) * 2 * Math.PI;
                const x = labelRadius * Math.cos(angle);
                const y = labelRadius * Math.sin(angle);

                ctx.fillText(m.toString(), x, y);
            }

            ctx.restore();

            // 4. Center Cap
            ctx.beginPath();
            ctx.arc(centerX, centerY, 7, 0, 2 * Math.PI);
            ctx.fillStyle = '#0f172a';
            ctx.fill();

            // カーソル表示の動的制御（停止中のみポインターカーソル）
            if (canvas) {
                canvas.style.cursor = (state.status === 'stopped' && state.viewMode !== 'clock') ? 'pointer' : 'default';
            }
        }

        // ANALOG CLOCK DRAWING FOR "現在時刻" MODE (Monochrome, Numbers Outside Dial)
        function drawAnalogClock(centerX, centerY) {
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const maxRadius = Math.min(centerX, centerY) - 4;
            const labelRadius = maxRadius - 10; // 数字を枠の外側に配置
            const dialRadius = maxRadius - 28;  // 文字盤の円半径

            // 1. Clock Face Inner Circle Background
            ctx.beginPath();
            ctx.arc(centerX, centerY, dialRadius, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = '#cbd5e1';
            ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);

            // 2. Clock Ticks (Monochrome)
            for (let i = 0; i < 60; i++) {
                const angle = (i * 2 * Math.PI) / 60;
                const isHour = (i % 5 === 0);

                const tickLength = isHour ? 8 : 4;
                const tickWidth = isHour ? 2 : 1;

                ctx.save();
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(0, -dialRadius);
                ctx.lineTo(0, -dialRadius + tickLength);
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = tickWidth;
                ctx.stroke();
                ctx.restore();
            }

            // 3. Clock Numbers (1-12 Outside the dial, clockwise)
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 15px "Inter", "Noto Sans JP", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = 1; i <= 12; i++) {
                const angle = (i * 2 * Math.PI) / 12 - Math.PI / 2;
                const x = labelRadius * Math.cos(angle);
                const y = labelRadius * Math.sin(angle);
                ctx.fillText(i.toString(), x, y);
            }

            // 4. Clock Hands (Monochrome)
            // Hour Hand
            const hourAngle = ((hours + minutes / 60 + seconds / 3600) * 2 * Math.PI) / 12;
            ctx.save();
            ctx.rotate(hourAngle);
            ctx.beginPath();
            ctx.moveTo(0, 8);
            ctx.lineTo(0, -(dialRadius * 0.55));
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#0f172a';
            ctx.stroke();
            ctx.restore();

            // Minute Hand
            const minuteAngle = ((minutes + seconds / 60) * 2 * Math.PI) / 60;
            ctx.save();
            ctx.rotate(minuteAngle);
            ctx.beginPath();
            ctx.moveTo(0, 10);
            ctx.lineTo(0, -(dialRadius * 0.82));
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#334155';
            ctx.stroke();
            ctx.restore();

            // Second Hand
            const secondAngle = (seconds * 2 * Math.PI) / 60;
            ctx.save();
            ctx.rotate(secondAngle);
            ctx.beginPath();
            ctx.moveTo(0, 12);
            ctx.lineTo(0, -(dialRadius * 0.88));
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#64748b';
            ctx.stroke();
            ctx.restore();

            ctx.restore();

            // 5. Center Cap
            ctx.beginPath();
            ctx.arc(centerX, centerY, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#0f172a';
            ctx.fill();
        }

        // SWIPE / TOUCH INTERACTION ON CANVAS TO SET TIME
        function handleCanvasPointer(e) {
            // 時計モード時およびタイマー動作中・一時停止中は指操作を無効化
            if (state.viewMode === 'clock' || state.status !== 'stopped') return;
            
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const x = clientX - rect.left - (rect.width / 2);
            const y = clientY - rect.top - (rect.height / 2);

            // Angle from top (-Math.PI / 2) going COUNTER-CLOCKWISE
            let angle = Math.atan2(y, x);
            let diff = -Math.PI / 2 - angle;
            
            if (diff < 0) {
                diff += 2 * Math.PI;
            }

            const fraction = diff / (2 * Math.PI);
            // While dragging, fix scale to 60 minutes for smooth user operation
            const scaleMinutes = isDraggingCanvas ? 60 : getScaleMinutes(state.setMinutes);
            let newMinutes = Math.round(fraction * scaleMinutes);

            if (newMinutes <= 0 && fraction > 0.9) newMinutes = scaleMinutes;
            
            setTimerDuration(newMinutes);
        }

        function initCanvasTouchControls() {
            if (!canvas) return;

            const onStart = (e) => {
                // タイマーがスタートしている場合はタッチの開始自体をブロック
                if (state.viewMode === 'clock' || state.status !== 'stopped') return;
                isDraggingCanvas = true;
                handleCanvasPointer(e);
            };

            const onMove = (e) => {
                if (isDraggingCanvas) {
                    handleCanvasPointer(e);
                }
            };

            const onEnd = () => {
                if (isDraggingCanvas) {
                    isDraggingCanvas = false;
                    // Redraw with the actual dynamic scale (5/10/30/60) after drag release
                    drawTimer();
                }
            };

            canvas.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            canvas.addEventListener('touchstart', onStart, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: true });
            window.addEventListener('touchend', onEnd);
        }

        // DIGITAL DISPLAY UPDATE
        function updateDigitalDisplay() {
            const displayEl = document.getElementById('digital-display');
            const periodBadge = document.getElementById('period-badge');
            const clockFormatToggle = document.getElementById('clock-format-toggle');
            if (!displayEl) return;

            if (state.viewMode === 'clock') {
                if (clockFormatToggle) clockFormatToggle.classList.remove('hidden');
                const now = new Date();
                const h24 = now.getHours();
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');

                // Seconds styling: Larger size, further right, spaced from colon
                const secondsHtml = `<span class="text-4xl sm:text-5xl md:text-6xl text-neutral-500 font-extrabold ml-4 sm:ml-6 md:ml-8 self-end mb-1 md:mb-2 inline-flex items-center"><span class="mr-2 opacity-60">:</span>${s}</span>`;

                if (state.clockFormat === '12h') {
                    const period = h24 >= 12 ? '午後' : '午前';
                    const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
                    const h = String(h12).padStart(2, '0');

                    if (periodBadge) {
                        periodBadge.textContent = period;
                        periodBadge.classList.remove('hidden');
                    }
                    displayEl.innerHTML = `<span class="tracking-tight">${h}:${m}</span>${secondsHtml}`;
                } else {
                    if (periodBadge) periodBadge.classList.add('hidden');
                    const h = String(h24).padStart(2, '0');
                    displayEl.innerHTML = `<span class="tracking-tight">${h}:${m}</span>${secondsHtml}`;
                }

                displayEl.style.color = '';
                displayEl.classList.remove('text-red-500');
                return;
            }

            if (clockFormatToggle) clockFormatToggle.classList.add('hidden');
            if (periodBadge) periodBadge.classList.add('hidden');

            if (state.status === 'finished') {
                const msg = state.finishMessage || 'おわり';
                displayEl.textContent = msg;
                
                // 文字数に応じて枠内に綺麗に収まるよう（自動改行対応）フォントサイズとレイアウトを調整
                const len = msg.length;
                let fontClasses = "text-5xl sm:text-7xl md:text-8xl lg:text-[7rem]";
                if (len >= 5 && len <= 8) {
                    fontClasses = "text-3xl sm:text-5xl md:text-6xl lg:text-[4.5rem]";
                } else if (len >= 9 && len <= 13) {
                    fontClasses = "text-2xl sm:text-3xl md:text-4xl lg:text-[3.2rem]";
                } else if (len >= 14) {
                    fontClasses = "text-xl sm:text-2xl md:text-3xl lg:text-[2.5rem]";
                }

                displayEl.className = `w-full h-full flex items-center justify-center text-center font-black tracking-tight break-words whitespace-pre-wrap select-none leading-tight px-2 ${fontClasses}`;
                displayEl.style.color = state.finishTextColor;
                return;
            }

            // 通常タイマー表示時のスタイル復元
            displayEl.style.color = '';
            displayEl.className = "w-full h-full flex items-baseline justify-center text-6xl sm:text-8xl md:text-9xl lg:text-[8.5rem] font-black tracking-tighter whitespace-nowrap select-none leading-none";
            displayEl.classList.remove('text-red-500');
            const mins = Math.floor(state.remainingSeconds / 60);
            const secs = state.remainingSeconds % 60;
            
            const formattedMins = String(mins).padStart(2, '0');
            const formattedSecs = String(secs).padStart(2, '0');
            
            displayEl.textContent = `${formattedMins}:${formattedSecs}`;
        }

        // TIMER CONTROLS LOGIC
        function setTimerDuration(minutes) {
            const clamped = Math.max(0, Math.min(60, minutes));
            state.setMinutes = clamped;
            state.remainingSeconds = clamped * 60;
            state.initialSeconds = clamped * 60;
            if (state.status === 'finished') {
                stopAlarm();
            }
            state.status = 'stopped';
            updatePlayPauseButton();
            updateDigitalDisplay();
            drawTimer();
        }

        function addMinutes(extraMinutes) {
            let newSecs = Math.min(3600, Math.max(0, state.remainingSeconds + (extraMinutes * 60)));
            state.remainingSeconds = newSecs;
            state.setMinutes = Math.ceil(newSecs / 60);
            if (state.status === 'finished') {
                stopAlarm();
            }
            if (state.status !== 'running') {
                state.status = 'stopped';
                state.initialSeconds = newSecs;
            }
            updatePlayPauseButton();
            updateDigitalDisplay();
            drawTimer();
        }

        function addSeconds(extraSeconds) {
            let newSecs = Math.min(3600, Math.max(0, state.remainingSeconds + extraSeconds));
            state.remainingSeconds = newSecs;
            state.setMinutes = Math.ceil(newSecs / 60);
            if (state.status === 'finished') {
                stopAlarm();
            }
            if (state.status !== 'running') {
                state.status = 'stopped';
                state.initialSeconds = newSecs;
            }
            updatePlayPauseButton();
            updateDigitalDisplay();
            drawTimer();
        }

        function startTimer() {
            if (state.remainingSeconds <= 0) return;
            if (state.status === 'stopped') {
                state.initialSeconds = state.remainingSeconds;
            }
            state.status = 'running';
            updatePlayPauseButton();

            if (timerInterval) clearInterval(timerInterval);
            
            const startTime = Date.now();
            const initialRemaining = state.remainingSeconds;

            timerInterval = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                state.remainingSeconds = Math.max(0, initialRemaining - elapsedSeconds);

                updateDigitalDisplay();
                drawTimer();

                if (state.remainingSeconds <= 0) {
                    onTimerFinished();
                }
            }, 200);
        }

        function pauseTimer() {
            state.status = 'paused';
            if (timerInterval) clearInterval(timerInterval);
            updatePlayPauseButton();
        }

        function toggleTimer() {
            if (state.status === 'finished') {
                stopAlarm();
                setTimerDuration(state.setMinutes);
                return;
            }
            if (state.status === 'running') {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function restartTimer() {
            stopAlarm();
            if (timerInterval) clearInterval(timerInterval);
            state.remainingSeconds = state.initialSeconds || (state.setMinutes * 60);
            state.status = 'stopped';
            updatePlayPauseButton();
            updateDigitalDisplay();
            drawTimer();
        }

        function resetTimer() {
            stopAlarm();
            if (timerInterval) clearInterval(timerInterval);
            state.setMinutes = 0;
            state.remainingSeconds = 0;
            state.initialSeconds = 0;
            state.status = 'stopped';
            updatePlayPauseButton();
            updateDigitalDisplay();
            drawTimer();
        }

        function updatePlayPauseButton() {
            const btnText = document.getElementById('toggle-button-text');
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');

            const btnTextOnly = document.getElementById('toggle-button-text-only');
            const playIconOnly = document.getElementById('play-icon-only');
            const pauseIconOnly = document.getElementById('pause-icon-only');

            if (state.status === 'running') {
                if (btnText) btnText.textContent = '一時停止';
                if (playIcon) playIcon.classList.add('hidden');
                if (pauseIcon) pauseIcon.classList.remove('hidden');

                if (btnTextOnly) btnTextOnly.textContent = '一時停止';
                if (playIconOnly) playIconOnly.classList.add('hidden');
                if (pauseIconOnly) pauseIconOnly.classList.remove('hidden');
            } else {
                if (btnText) btnText.textContent = 'スタート';
                if (playIcon) playIcon.classList.remove('hidden');
                if (pauseIcon) pauseIcon.classList.add('hidden');

                if (btnTextOnly) btnTextOnly.textContent = 'スタート';
                if (playIconOnly) playIconOnly.classList.remove('hidden');
                if (pauseIconOnly) pauseIconOnly.classList.add('hidden');
            }
        }

        // ALARM AUDIO
        function playAlarm() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                stopAlarm();

                let count = 0;
                alarmInterval = setInterval(() => {
                    if (count >= 10) {
                        stopAlarm();
                        return;
                    }

                    for (let i = 0; i < 3; i++) {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        
                        osc.type = 'sine';
                        osc.frequency.value = 880;

                        const startTime = audioCtx.currentTime + (i * 0.15);
                        gain.gain.setValueAtTime(0.3, startTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.1);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start(startTime);
                        osc.stop(startTime + 0.1);
                    }

                    count++;
                }, 1000);
            } catch (e) {
                console.error("Audio error:", e);
            }
        }

        function stopAlarm() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        function onTimerFinished() {
            if (timerInterval) clearInterval(timerInterval);
            state.status = 'finished';
            updatePlayPauseButton();
            updateDigitalDisplay();
            drawTimer();
            playAlarm();
        }

        function updateSelectedColorUI() {
            document.querySelectorAll('.color-btn').forEach(btn => {
                const color = btn.getAttribute('data-color');
                if (color === state.timerColor) {
                    btn.classList.add('border-neutral-900', 'scale-110');
                } else {
                    btn.classList.remove('border-neutral-900', 'scale-110');
                }
            });

            document.querySelectorAll('.text-color-btn').forEach(btn => {
                const color = btn.getAttribute('data-text-color');
                if (color === state.finishTextColor) {
                    btn.classList.add('border-neutral-900', 'scale-110');
                } else {
                    btn.classList.remove('border-neutral-900', 'scale-110');
                }
            });
        }

        // ONLOAD ATTACH LISTENERS
        window.addEventListener('load', () => {
            loadSavedState();

            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            }, { passive: false });

            // Canvas Observer / Resize
            window.addEventListener('resize', resizeCanvas);
            if ('ResizeObserver' in window && canvas && canvas.parentElement) {
                const ro = new ResizeObserver(() => resizeCanvas());
                ro.observe(canvas.parentElement);
            }
            resizeCanvas();

            // Swipe / Touch Controls on Timer Canvas
            initCanvasTouchControls();

            // View Mode Selector Listeners
            addEvt('mode-timer-only', 'click', () => setViewMode('timer-only'));
            addEvt('mode-both', 'click', () => setViewMode('both'));
            addEvt('mode-digital-only', 'click', () => setViewMode('digital-only'));
            addEvt('mode-clock', 'click', () => setViewMode('clock'));

            // Clock Format Toggle Listeners
            addEvt('btn-clock-12h', 'click', () => setClockFormat('12h'));
            addEvt('btn-clock-24h', 'click', () => setClockFormat('24h'));

            // Timer Minute Adjusters
            addEvt('btn-time-up', 'click', () => addMinutes(1));
            addEvt('btn-time-down', 'click', () => addMinutes(-1));
            // Quick Minutes & Seconds
            addEvt('btn-add-1', 'click', () => addMinutes(1));
            addEvt('btn-add-5', 'click', () => addMinutes(5));
            addEvt('btn-add-10', 'click', () => addMinutes(10));
            addEvt('btn-add-10s', 'click', () => addSeconds(10));

            // Start, Restart & Reset Buttons
            addEvt('btn-toggle-timer', 'click', toggleTimer);
            addEvt('btn-restart', 'click', restartTimer);
            addEvt('btn-reset', 'click', resetTimer);

            // Timer-Only Mode Action Buttons
            addEvt('btn-toggle-timer-only', 'click', toggleTimer);
            addEvt('btn-restart-only', 'click', restartTimer);
            addEvt('btn-reset-only', 'click', resetTimer);

            // Settings Modal Open/Close
            const modal = document.getElementById('settings-modal');
            const msgInput = document.getElementById('input-finish-msg');

            addEvt('btn-open-settings', 'click', () => {
                updateSelectedColorUI();
                if (msgInput) {
                    msgInput.value = state.finishMessage;
                }
                if (modal) modal.classList.remove('hidden');
            });

            const closeModal = () => {
                if (modal) modal.classList.add('hidden');
            };

            const saveAndCloseModal = () => {
                if (msgInput) {
                    const newMsg = msgInput.value.trim();
                    state.finishMessage = newMsg !== '' ? newMsg : 'おわり';
                    saveState();
                    updateDigitalDisplay();
                }
                closeModal();
            };

            addEvt('btn-close-settings', 'click', closeModal);
            addEvt('btn-save-settings', 'click', saveAndCloseModal);

            // Color Selection Handler
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.timerColor = e.currentTarget.getAttribute('data-color');
                    saveState();
                    updateSelectedColorUI();
                    drawTimer();
                });
            });

            // Text Color Selection Handler
            document.querySelectorAll('.text-color-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.finishTextColor = e.currentTarget.getAttribute('data-text-color');
                    saveState();
                    updateSelectedColorUI();
                    if (state.status === 'finished') {
                        updateDigitalDisplay();
                    }
                });
            });

            // Initial UI Sync
            updateDigitalDisplay();
            drawTimer();
        });
